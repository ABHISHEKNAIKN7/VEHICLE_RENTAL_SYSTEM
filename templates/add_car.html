{% extends "base.html" %}
{% block title %}Add Car{% endblock %}
{% block content %}
<section class="hero">
    <h1>Add a New Car</h1>
    <p class="lead">Create a new fleet entry with complete rental details.</p>
</section>

<section class="panel">
    <form action="{{ url_for('add_car') }}" method="post">
        <label for="car_model">Car Model</label>
        <input type="text" id="car_model" name="car_model" required>

        <label for="car_type">Car Type</label>
        <input type="text" id="car_type" name="car_type" required>

        <label for="car_transmission">Car Transmission</label>
        <input type="text" id="car_transmission" name="car_transmission" required>

        <label for="hourly_rate">Hourly Rate</label>
        <input type="number" id="hourly_rate" name="hourly_rate" required>

        <label for="car_image_url">Car Image URL (optional)</label>
        <input type="url" id="car_image_url" name="car_image_url" placeholder="https://example.com/car.jpg">

        <div class="btn-row">
            <button class="btn" type="submit">Add Car</button>
            <a class="btn secondary" href="{{ url_for('admin_dashboard') }}">Back</a>
        </div>
    </form>
</section>
{% endblock %}
