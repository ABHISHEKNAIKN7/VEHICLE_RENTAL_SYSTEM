{% extends "base.html" %}
{% block title %}Registered User Login{% endblock %}
{% block content %}
<section class="hero">
    <h1>Registered User Login</h1>
    <p class="lead">Access your rentals, bookings, and payments.</p>
</section>

<section class="panel">
    <form method="POST">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" required aria-label="Username">

        <label for="password">Password</label>
        <input type="password" id="password" name="password" required aria-label="Password">

        <div class="btn-row">
            <button type="submit" class="btn">Login</button>
            <a href="{{ url_for('customer_dashboard') }}" class="btn secondary">Back</a>
        </div>
    </form>
</section>
{% endblock %}
